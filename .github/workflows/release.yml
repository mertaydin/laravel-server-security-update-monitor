name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release commit
        id: release
        shell: bash
        run: |
          COMMIT_MESSAGE="$(git log -1 --format=%s)"
          if [[ ! "$COMMIT_MESSAGE" =~ ^Release\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${COMMIT_MESSAGE#Release }"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release and tag
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --title "${{ steps.release.outputs.version }}" --generate-notes