name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Run unit tests
        run: composer test
      - name: Check dashboard JavaScript syntax
        run: node --check resources/assets/js/dashboard.js
      - name: Check PHP syntax
        run: |
          find src config routes lang -type f -name '*.php' -print0 | xargs -0 -n1 php -l
