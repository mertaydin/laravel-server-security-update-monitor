name: Package manager integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            manager: APT / Ubuntu 24.04
          - image: debian:12
            manager: APT / Debian 12
          - image: fedora:latest
            manager: DNF5 / Fedora
          - image: rockylinux:9
            manager: DNF4 / Rocky Linux 9
    name: ${{ matrix.manager }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install PHP and Composer, then run against the native package manager
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update
                apt-get install -y php-cli php-mbstring php-xml php-curl php-sqlite3 php-zip unzip composer
              else
                dnf -y makecache
                . /etc/os-release
                if [ "$ID" = rocky ]; then
                  dnf -y install epel-release https://rpms.remirepo.net/enterprise/remi-release-9.rpm
                  dnf -y module reset php
                  dnf -y module enable php:remi-8.2
                fi
                dnf -y install php-cli php-mbstring php-xml php-pdo php-sqlite3 php-curl unzip composer
                dnf -y makecache
              fi
              composer install --no-interaction --prefer-dist
              vendor/bin/phpunit tests/Integration
            '
